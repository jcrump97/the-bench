name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs every gate and uploads the Pages artifact it verified, so the deploy
  # below publishes exactly the build the E2E suite passed against.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout needed — this consumes the artifact `verify` uploaded.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
